<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://telegram.org 'unsafe-inline'; connect-src https://mjepxubktjnrkliidnzj.supabase.co; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* The owner's report as a Telegram Mini App (VIA-399). Colours follow Telegram's theme;
   the chart palette is the dataviz reference set, light and dark steps picked by the scheme. */
:root {
  --bg: var(--tg-theme-bg-color, #fcfcfb);
  --card: var(--tg-theme-secondary-bg-color, #f3f3f0);
  --text: var(--tg-theme-text-color, #0b0b0b);
  --hint: var(--tg-theme-hint-color, #52514e);
  --muted: #898781;
  --grid: rgba(128, 128, 128, 0.22);
  --axis: rgba(128, 128, 128, 0.45);
  --accent: var(--tg-theme-button-color, #2a78d6);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --good: #006300;
  --bad: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #6250d6; --s7: #008300; --s8: #e34948;
  --other: #a9a79f;
  color-scheme: light;
}
:root[data-scheme="dark"] {
  --good: #0ca30c;
  --grid: rgba(255, 255, 255, 0.12);
  --axis: rgba(255, 255, 255, 0.28);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s7: #008300; --s8: #e66767;
  --other: #6f6e68;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
body { padding: 12px 14px 32px; max-width: 720px; margin: 0 auto; }
h1 { overflow-wrap: anywhere; font-size: 22px; margin: 6px 0 2px; }
h2 { font-size: 17px; margin: 22px 0 6px; }
.sub { min-width: 0; overflow-wrap: anywhere; color: var(--hint); font-size: 13px; margin: 0 0 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 4px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; color: var(--text); border: 0; padding: 7px 10px; font: inherit; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
@media (min-width: 520px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--card); border-radius: 12px; padding: 10px 12px; }
.tile .label { color: var(--hint); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 600; margin: 2px 0 0; }
.tile .delta { font-size: 12px; color: var(--hint); }
.tile .delta.up { color: var(--good); }
.tile .delta.down { color: var(--bad); }
figure { min-width: 0; margin: 0 0 6px; background: var(--card); border-radius: 12px; padding: 10px 12px 8px; }
figure figcaption { display: flex; flex-wrap: wrap; min-width: 0; justify-content: space-between; align-items: baseline; gap: 8px; }
figure figcaption b { font-size: 15px; min-width: 0; overflow-wrap: anywhere; flex: 1 1 170px; }
figure figcaption .tbtn { flex: 0 0 auto; }
figure .cap { overflow-wrap: anywhere; color: var(--hint); font-size: 12.5px; margin: 6px 0 0; }
figure svg { width: 100%; height: auto; display: block; touch-action: pan-y; outline: none; }
figure svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--hint); margin: 4px 0 2px; }
.legend span { min-width: 0; overflow-wrap: anywhere; display: inline-flex; align-items: center; gap: 6px; }
.legend i { flex-shrink: 0; display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; }
.tbtn { background: transparent; border: 1px solid var(--axis); border-radius: 8px; color: var(--hint); font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
.tw { max-width: 100%; overflow-x: auto; }
.dated th:first-child, .dated td:first-child { min-width: 54px; overflow-wrap: normal; }
.vheads th:first-child, .vheads td:first-child { min-width: 54px; overflow-wrap: normal; }
.vheads th { vertical-align: bottom; }
.vheads th:not(:first-child) { writing-mode: vertical-rl; white-space: nowrap; padding: 6px 3px; }
.countries td:first-child, .sales td:nth-child(3) { overflow-wrap: normal; -webkit-hyphens: auto; hyphens: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 2px; }
th, td { overflow-wrap: anywhere; text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.money th, .cell-number, th.short { white-space: nowrap; }
figure th, figure td { padding: 5px 3px; }
.sales th, .sales td:nth-child(2) { white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--bg); color: var(--text); border: 1px solid var(--axis); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.15); max-width: 240px; }
.tip b { font-size: 13px; }
.tip .r { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.tip .r i { display: inline-block; width: 12px; height: 2px; margin-right: 6px; }
.tip .r .v { font-weight: 600; }
.funnel .cty { display: grid; grid-template-columns: 84px minmax(0, 1fr) 40px; gap: 6px 10px; align-items: center; margin: 6px 0; }
.funnel .cty .name { font-weight: 600; font-size: 13px; line-height: 1.25; -webkit-hyphens: auto; hyphens: auto; overflow-wrap: anywhere; }
.funnel .bars, .funnel .values { display: grid; grid-template-rows: repeat(5, 12px); gap: 3px; }
.funnel .bar { height: 12px; border-radius: 0 4px 4px 0; position: relative; min-width: 2px; }
.funnel .values span { font-size: 11px; line-height: 12px; color: var(--hint); white-space: nowrap; text-align: right; }
.err { color: var(--bad); padding: 20px 0; }
.loading { opacity: .55; transition: opacity .2s; }
.note { text-align: center; color: var(--hint); padding: 60px 20px; font-size: 17px; }
.feedback td.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.feedback .original, .feedback .untranslated { color: var(--hint); font-size: 12px; }
.feedback .original, .feedback .words { margin-top: 4px; }
.code { color: var(--hint); font-size: 12px; font-weight: normal; }
.capped { display: block; color: var(--bad); font-weight: 600; white-space: nowrap; }
.campaigns tr.name td { border-bottom: 0; padding-bottom: 0; font-weight: 600; overflow-wrap: normal; word-break: normal; }
.campaigns td.num { white-space: nowrap; }
.campaigns th, .campaigns td { overflow-wrap: normal; }
.campaigns th:not(:first-child), .campaigns td:not(:first-child) { text-align: right; }
.product-name { overflow-wrap: normal; }
.feedback .identity span { display: block; white-space: nowrap; }
.feedback .identity .id { color: var(--hint); font-size: 12px; }
.feedback td:nth-child(3), .feedback th:nth-child(3) { width: 60%; min-width: 120px; }
.cohort td:first-child span, .cohort td:nth-child(2) span, .cohort td:nth-child(4) span { display: block; white-space: nowrap; }
.cohort td:nth-child(3) { overflow-wrap: normal; min-width: 84px; }
.cohort td:nth-child(4) .code { font-size: 11.5px; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main id="app"><p class="note" id="boot">Загружаю отчёт…</p></main>
<div id="tip" class="tip hidden" role="status" aria-live="polite"></div>
<script>
(function () {
  "use strict";
  var API = "https://mjepxubktjnrkliidnzj.supabase.co/functions/v1/balance-watch/report";
  // VIA-492: the site viavo.app doesn't count visits from a browser that opened this report (the owner's own).
  try { window.localStorage.setItem("viavo_team", "1"); } catch (e) { /* storage off: visits from here count */ }
  var tg = window.Telegram && window.Telegram.WebApp;
  var initData = tg && tg.initData ? tg.initData : "";
  var app = document.getElementById("app");
  var tip = document.getElementById("tip");
  var state = { days: 7, data: null };
  var seq = 0, redrawers = [], resizeTimer, tipChart = null;

  // Markets keep their colour whatever the period shows (colour follows the entity).
  var MARKET_SLOT = Object.assign(Object.create(null), { IT: 1, IL: 2, ES: 3, SA: 4, FR: 5, DE: 6, US: 7, unknown: 0 });
  var SLOT_VAR = ["var(--other)", "var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
  var ORDINAL = ["var(--s1)", "var(--s3)", "var(--s4)", "var(--s2)", "var(--s6)"];

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    setAttrs(node, attrs);
    appendAll(node, children);
    return node;
  }
  function svgEl(tag, attrs, children) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    setAttrs(node, attrs);
    appendAll(node, children);
    return node;
  }
  function setAttrs(node, attrs) {
    if (!attrs) return;
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined) return;
      if (k === "text") node.textContent = String(attrs[k]);
      else node.setAttribute(k, String(attrs[k]));
    });
  }
  function appendAll(node, children) {
    if (!children) return;
    (Array.isArray(children) ? children : [children]).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function fmt(n, digits) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    if (digits === undefined) digits = Number.isInteger(n) ? 0 : 1;
    return new Intl.NumberFormat("ru-RU", { maximumFractionDigits: digits }).format(n);
  }
  // What «прочее» in the spend holds; the bot says the same (balance-watch/report.ts OTHER_SPEND).
  var OTHER_SPEND = "eval, реклама, тесты команды, прогрев кэша, новости, переводы, сводки истории и память водителей";
  function usd(n, digits) { return n === null || n === undefined ? "—" : (n < 0 ? "−$" : "$") + Math.abs(Number(n)).toFixed(digits === undefined ? 2 : digits); }
  function dayLabel(iso) { return iso.slice(8, 10) + "." + iso.slice(5, 7); }
  function timeUtc(iso) { var d = new Date(iso); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); }
  var REGION_NAMES = (function () { try { return new Intl.DisplayNames(["ru"], { type: "region" }); } catch (e) { return null; } })();
  // a country in Russian words (VIA-440), «?» when the phone named none; a code the browser doesn't know stays as is
  function country(code) {
    if (code === "unknown") return "?";
    if (code === "US") return "США";
    try { return (REGION_NAMES && REGION_NAMES.of(code)) || code; } catch (e) { return code; }
  }
  function feedbackKind(kind) { return kind === "feature" ? "фича" : kind === "bug" ? "баг" : kind === "paywall_exit" ? "пейвол" : kind; }
  function reportLabel(kind, code) {
    var labels = state.data && state.data.labels && state.data.labels[kind];
    return labels && Object.prototype.hasOwnProperty.call(labels, code) ? labels[code] : code;
  }
  function exitReason(reason) { return reportLabel("exitReasons", reason); }
  function errorLabel(code) {
    var label = reportLabel("errors", code);
    return el("span", null, [label, label === code ? null : el("span", { class: "code", text: " (" + code + ")" })]);
  }
  function sum(arr, pick) { return arr.reduce(function (t, x) { return t + (pick ? pick(x) : x); }, 0); }
  // The phone's failure reports (VIA-431): "ActionFailure:PLAYBACK_FAILED" → «сбой действия (PLAYBACK_FAILED)».
  function deviceErrorLabel(code) {
    var cut = code.search(/[:.]/), base = cut < 0 ? code : code.slice(0, cut), detail = cut < 0 ? "" : code.slice(cut + 1);
    var label = reportLabel("deviceErrors", base);
    if (label === base) return code;
    return detail ? label + " (" + detail + ")" : label;
  }
  function deviceFailures(r) { var d = r.quality.device; return d ? d.failed + d.partial : 0; }
  function deviceRows(r) {
    var d = r.quality.device;
    return d ? d.by_action.map(function (a) {
      return [reportLabel("actions", a.action), fmt(a.n), fmt(a.of), fmt(a.drivers), a.codes.map(function (c) { return deviceErrorLabel(c.code) + " " + fmt(c.n); }).join(", ")];
    }) : [];
  }
  function deviceNote(r) {
    var d = r.quality.device;
    return d ? "Всего " + fmt(d.failed + d.partial) + " из " + fmt(d.actions) + " действий" + (d.partial ? ", из них частично " + fmt(d.partial) : "") +
      " · водителей " + fmt(d.drivers) + " · юнит вернули за " + fmt(d.refunded) + " ходов. Сбой — то, что сам телефон сообщил после действия; исход такого хода в таблице исходов — «сбой на телефоне»." : "";
  }
  function productName(id) {
    if (id === "app.viavo.drive.plus.monthly") return "Plus, месяц";
    if (id === "app.viavo.drive.plus.yearly") return "Plus, год";
    var packs = { "app.viavo.drive.credits.100": 100, "app.viavo.drive.credits.300": 300, "app.viavo.drive.credits.1000": 1000 };
    if (Object.prototype.hasOwnProperty.call(packs, id)) return "пакет " + packs[id] + " кредитов";
    return "неизв. продукт";
  }
  // A sale by its event type: a ping without a billing row (before 28.10, when the free week began), so a Plus start may have been either.
  function eventName(t, product) {
    if (t === "INITIAL_PURCHASE") return product === "app.viavo.drive.plus.monthly" || product === "app.viavo.drive.plus.yearly" ? "новая подписка или пробный" : "покупка";
    if (t === "RENEWAL") return "продление";
    if (t === "NON_RENEWING_PURCHASE") return "покупка";
    // owner_report names a refund REFUND; CANCELLATION is renewal turned off (VIA-428).
    if (t === "REFUND") return "возврат";
    if (t === "CANCELLATION") return "отмена";
    if (t === "UNCANCELLATION") return "снова включил продление";
    // only a trial's EXPIRATION is pinged; without a kind it is a cancelled trial's end (VIA-502), or from before kinds
    if (t === "EXPIRATION") return "пробный закончился";
    return t || "неизвестное событие";
  }
  // VIA-502: a pinged sale by its kind (owner_sale_kind on the billing row), else by its event type.
  function saleEventName(row) {
    if (row.kind) { var label = reportLabel("saleEvents", row.kind); if (label !== row.kind) return label; }
    return eventName(row.event_type, row.product_id);
  }
  // Sales by kind (VIA-502): the kinds from billing events, packs and refunds from unit_purchases; the bot's order
  // (balance-watch report.ts SALE_LINE). The rare ones show only when the window or its comparison had any.
  var SALE_MAIN = ["trial_started", "trial_converted", "paid_started", "renewal", "packs", "trial_cancelled", "cancelled", "refunds"];
  var SALE_RARE = ["trial_expired", "uncancelled", "trial_refused", "billing_failed", "promo"];
  // fewer is better for these; promo (free access) is neither
  var SALE_FEWER_BETTER = { trial_cancelled: true, cancelled: true, refunds: true, trial_expired: true, trial_refused: true, billing_failed: true };
  // a count of `key` in owner_report's sales or a series day: undefined when the server sent no kinds
  function saleCount(x, key) {
    if (key === "packs" || key === "refunds") return x[key];
    return x.kinds ? x.kinds[key] || 0 : undefined;
  }
  function saleLabel(key) { var label = reportLabel("saleKinds", key); return label.charAt(0).toUpperCase() + label.slice(1); }
  function stamp(iso) { return dayLabel(iso) + " " + timeUtc(iso) + " UTC"; }

  // ---------- theme
  function applyScheme() {
    var dark = tg && tg.colorScheme === "dark";
    if (!tg && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) dark = true;
    document.documentElement.setAttribute("data-scheme", dark ? "dark" : "light");
  }

  // ---------- tooltip
  function showTip(x, y, title, rows) {
    clear(tip);
    tip.appendChild(el("b", { text: title }));
    rows.forEach(function (r) {
      var row = el("div", { class: "r" });
      var left = el("span");
      if (r.color) { var sw = el("i"); sw.style.background = r.color; left.appendChild(sw); }
      left.appendChild(document.createTextNode(r.name));
      if (r.code) left.appendChild(el("span", { class: "code", text: " (" + r.code + ")" }));
      row.appendChild(left);
      row.appendChild(el("span", { class: "v", text: r.value }));
      tip.appendChild(row);
    });
    tip.classList.remove("hidden");
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8);
    var top = y - h - 14;
    if (top < 8) top = y + 18;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hideTip() {
    tip.classList.add("hidden");
    if (tipChart) tipChart.querySelector(".cross").classList.add("hidden");
    tipChart = null;
  }
  document.addEventListener("pointerdown", function (ev) { if (!ev.target.closest("svg")) hideTip(); });

  function redrawCharts() {
    hideTip();
    redrawers.forEach(function (draw) { draw(); });
  }
  function scheduleRedraw() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(redrawCharts, 150);
  }

  // ---------- a figure: title, table toggle, legend, chart, caption
  function figure(title, caption, chartNode, legendItems, table) {
    var fig = el("figure");
    var draw = typeof chartNode === "function" ? chartNode : null;
    if (draw) {
      chartNode = draw(340);
      redrawers.push(function () {
        var css = getComputedStyle(fig);
        var width = fig.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
        var next = draw(width > 0 ? width : 340);
        next.classList.toggle("hidden", chartNode.classList.contains("hidden"));
        chartNode.replaceWith(next);
        chartNode = next;
      });
      if (draw.partialLast) caption = (caption ? caption + " " : "") + (draw.hasBars ? "Последний столбик" : "Последняя точка") + " — сегодня до " + timeUtc(state.data.generated_at) + " UTC.";
    }
    var tb = el("button", { class: "tbtn", type: "button", "aria-pressed": "false", text: "Таблица" });
    fig.appendChild(el("figcaption", null, [el("b", { text: title }), table ? tb : null]));
    if (legendItems && (legendItems.length > 1 || legendItems.some(function (it) { return it.kind === "line"; }))) {
      var lg = el("div", { class: "legend" });
      legendItems.forEach(function (it) {
        var sw = el("i", { class: it.kind === "line" ? "line" : "" });
        sw.style.background = it.color;
        var last;
        if (it.kind === "line") {
          for (var i = it.values.length - 1; i >= 0; i--) {
            if (it.values[i] !== null && it.values[i] !== undefined) { last = it.values[i]; break; }
          }
        }
        var name = it.name + (it.legendValue !== undefined ? " · " + fmt(it.legendValue) : it.kind === "line" ? " · " + (last === null || last === undefined ? "—" : (draw && draw.fmtValue ? draw.fmtValue(last) : fmt(last))) : "");
        lg.appendChild(el("span", null, [sw, name, it.code ? el("span", { class: "code", text: " (" + it.code + ")" }) : null]));
      });
      fig.appendChild(lg);
    }
    fig.appendChild(chartNode);
    var tbl = table ? table() : null;
    if (tbl) { tbl.classList.add("hidden"); fig.appendChild(tbl); }
    if (caption) fig.appendChild(el("p", { class: "cap", text: caption }));
    tb.addEventListener("click", function () {
      var on = tb.getAttribute("aria-pressed") !== "true";
      tb.setAttribute("aria-pressed", on ? "true" : "false");
      tb.textContent = on ? "График" : "Таблица";
      chartNode.classList.toggle("hidden", on);
      if (tbl) tbl.classList.toggle("hidden", !on);
    });
    return fig;
  }

  function dataTable(head, rows, textColumns) {
    function numeric(c, i) {
      return i > 0 && (!textColumns || textColumns.indexOf(i) < 0) && /^(?:(?:≥ )?−?\$?−?-?\d[\d\s]*(?:[.,]\d+)?(?: %)?|—)$/.test(String(c));
    }
    var t = el("table");
    if (head[0].indexOf("Когда") === 0) t.classList.add("dated");
    if (head.indexOf("$/ход") >= 0) t.classList.add("money");
    if (head[0] === "Страна") t.classList.add("countries");
    var tr = el("tr");
    head.forEach(function (h, i) {
      var th = el("th", { class: (rows.length && rows.every(function (r) { return numeric(r[i], i); }) ? "num" : "") + (typeof h === "string" && h.length <= 3 ? " short" : "") });
      if (h && h.nodeType) th.appendChild(h); else th.textContent = h;
      tr.appendChild(th);
    });
    t.appendChild(el("thead", null, tr));
    var body = el("tbody");
    rows.forEach(function (r) {
      var row = el("tr");
      r.forEach(function (c, i) {
        var isNumber = numeric(c, i);
        var cell = el("td", { class: isNumber ? "num cell-number" : "" });
        if (c && c.nodeType) cell.appendChild(c);
        else cell.textContent = c;
        row.appendChild(cell);
      });
      body.appendChild(row);
    });
    t.appendChild(body);
    return el("div", { class: "tw" }, t);
  }

  // ---------- the time chart: stacked or grouped bars and lines on one count axis,
  // a crosshair snapping to the day, one tooltip with every series, keyboard arrows.

      app.appendChild(dataTable(["Сервис", todayMode ? "Сегодня" : "Вчера"], rows, [1]));
      if (summary) {
        app.appendChild(el("p", { class: "sub", text: "Цена хода — ходы водителей, делённые на их " + fmt(td.activity.turns) + " ходов за " + dayLabel(td.from) + ": их токены по ставкам дневного счёта Anthropic и их доля распознавания и озвучки. Прочее — " + OTHER_SPEND + "." + (summary.listPriced ? " Ставки счёта не прочитаны: Anthropic по прейскуранту, он выше счёта." : "") }));
        if (summary.unpriced && summary.unpriced.length) app.appendChild(el("p", { class: "sub", text: "Нет цены модели " + summary.unpriced.join(", ") + ": её токены не в ходах и не в прочем." }));
        if (summary.elevenLabsUsd === null) app.appendChild(el("p", { class: "sub", text: "ElevenLabs не учтён в сумме и цене хода." }));
      }
      app.appendChild(el("p", { class: "sub", text: "Данные расходов на " + timeUtc(sp.read_at) + " UTC." }));
      var failures = (sp.errors || []).filter(function (e) { return !todayMode || !/^Anthropic:/.test(e); });
      if (failures.length) app.appendChild(el("p", { class: "sub", text: "Не прочитано: " + failures.join("; ") }));
    } else app.appendChild(el("p", { class: "sub", text: "Расходы не прочитаны" + (data.spend_error ? ": " + data.spend_error : ".") }));
    app.appendChild(el("footer", { text: "Сутки UTC. Команда и тестовые аккаунты исключены." }));
  }

  function countryN(d, code) { var c = (d.signups_by_country || []).find(function (x) { return x.country === code; }); return c ? c.n : 0; }

  // the funnel: a row per country, five ordinal bars scaled to the country's sign-ups
  function funnelFigure(retention) {
    var rows = (retention.funnel_30d || []).filter(function (f) { return f.country !== "unknown"; }).slice(0, 8);
    var total = retention.funnel_30d_total;
    var stages = [["signups", "регистрации"], ["with_requests", "с запросом"], ["in_car", "в машине"], ["returned", "вернулись"], ["subscribed", "подписка"]];
    var box = el("div", { class: "funnel" });
    var maxSign = Math.max.apply(null, [1].concat(rows.map(function (f) { return f.signups; })));
    rows.forEach(function (f) {
      var bars = el("div", { class: "bars" });
      var values = el("div", { class: "values" });
      stages.forEach(function (st, i) {
        var bar = el("div", { class: "bar", title: st[1] + ": " + f[st[0]] });
        bar.style.background = ORDINAL[i];
        bar.style.width = Math.max(1, (100 * f[st[0]]) / maxSign) + "%";
        values.appendChild(el("span", { text: fmt(f[st[0]]) }));
        bars.appendChild(bar);
      });
      box.appendChild(el("div", { class: "cty" }, [el("div", { class: "name", text: country(f.country) }), bars, values]));
    });
    var legend = stages.map(function (st, i) { return { name: st[1], color: ORDINAL[i] }; });
    var fig = figure("Регистрации → запрос → машина → возврат → подписка", "Всего за 30 дней: " + fmt(total.signups) + " → " + fmt(total.with_requests) + " → " + fmt(total.in_car) + " → " + fmt(total.returned) + " → " + fmt(total.subscribed) + ". Вернулись — запрос через 12 ч и позже после первого. Без «?».",
      box, legend, function () {
        return dataTable(["Страна"].concat(stages.map(function (st) { return st[1]; })), (retention.funnel_30d || []).map(function (f) { return [country(f.country)].concat(stages.map(function (st) { return fmt(f[st[0]]); })); }));
      });
    return fig;
  }

  // ---------- load
  function load(days) {
    var request = ++seq;
    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, 20000);
    state.days = days;
    app.classList.add("loading");
    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
      body: JSON.stringify({ days: days }),
      signal: controller.signal
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status === 401 ? "Telegram не подтвердил, что это владелец (401). Откройте отчёт из бота ещё раз." : "Сервер ответил " + r.status);
      return r.json();
    }).then(function (data) {
      if (request !== seq) return;
      if (!data || data.days !== days || (days === 0
        ? !data.today || !data.same_hours_yesterday || !data.hourly || !Array.isArray(data.hourly.today) || data.hourly.today.length !== 24 || !Array.isArray(data.hourly.yesterday) || data.hourly.yesterday.length !== 24
        : days === 1 ? !data.yesterday || !Object.prototype.hasOwnProperty.call(data, "base") || !data.hourly || !Array.isArray(data.hourly.yesterday) || data.hourly.yesterday.length !== 24 || !Array.isArray(data.hourly.day_before) || data.hourly.day_before.length !== 24
        : days === "week_ago" ? !Array.isArray(data.series) || !data.period || !data.previous || !Object.prototype.hasOwnProperty.call(data, "cohort") || (data.cohort !== null && !Array.isArray(data.cohort.drivers))
        : !Array.isArray(data.series) || !data.yesterday || !data.today || !data.period)) throw new Error("Сервер ответил не отчётом");
      state.data = data;
      render(data);
    }).catch(function (e) {
      if (request !== seq) return;
      hideTip();
      redrawers = [];
      clear(app);
      app.appendChild(el("p", { class: "err", text: "Не удалось загрузить отчёт: " + (controller.signal.aborted ? "Сервер не ответил за 20 с" : (e && e.message ? e.message : String(e))) }));
      var again = el("button", { class: "tbtn", type: "button", text: "Попробовать ещё раз" });
      again.addEventListener("click", function () { load(state.days); });
      app.appendChild(again);
    }).finally(function () {
      clearTimeout(timeout);
      if (request === seq) app.classList.remove("loading");
    });
  }

  applyScheme();
  window.addEventListener("resize", scheduleRedraw);
  if (tg) {
    tg.ready();
    tg.expand();
    tg.onEvent("themeChanged", applyScheme);
    tg.onEvent("viewportChanged", scheduleRedraw);
  }
  if (!initData) {
    clear(app);
    app.appendChild(el("p", { class: "note", text: "Откройте отчёт из бота" }));
  } else {
    load(state.days);
  }
})();
</script>
</body>
</html>
