/* The owner's report as a Telegram Mini App (VIA-399). Colours follow Telegram's theme;

:root {

  --bad: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #6250d6; --s7: #008300; --s8: #e34948;
  --other: #a9a79f;

}
:root[data-scheme="dark"] {
  --good: #0ca30c;
  --grid: rgba(255, 255, 255, 0.12);
  --axis: rgba(255, 255, 255, 0.28);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s7: #008300; --s8: #e66767;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
body { padding: 12px 14px 32px; max-width: 720px; margin: 0 auto; }

.sub { min-width: 0; overflow-wrap: anywhere; color: var(--hint); font-size: 13px; margin: 0 0 10px; }

.tbtn { background: transparent; border: 1px solid var(--axis); border-radius: 8px; color: var(--hint); font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }

.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--bg); color: var(--text); border: 1px solid var(--axis); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.15); max-width: 240px; }
.tip b { font-size: 13px; }

  function dayLabel(iso) { return iso.slice(8, 10) + "." + iso.slice(5, 7); }
  function timeUtc(iso) { var d = new Date(iso); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); }
  function country(code) { return code === "unknown" ? "?" : code; }
  function sum(arr, pick) { return arr.reduce(function (t, x) { return t + (pick ? pick(x) : x); }, 0); }
  function productName(id) {
    if (id === "app.viavo.drive.plus.monthly") return "Plus, месяц";

    if (Object.prototype.hasOwnProperty.call(packs, id)) return "пакет " + packs[id] + " кредитов";

  // ---------- theme
  function applyScheme() {
    var dark = tg && tg.colorScheme === "dark";
    if (!tg && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) dark = true;
    document.documentElement.setAttribute("data-scheme", dark ? "dark" : "light");
  }

  // ---------- tooltip
  function showTip(x, y, title, rows) {
    clear(tip);
    tip.appendChild(el("b", { text: title }));
    rows.forEach(function (r) {
      var row = el("div", { class: "r" });
      var left = el("span");
      if (r.color) { var sw = el("i"); sw.style.background = r.color; left.appendChild(sw); }
      left.appendChild(document.createTextNode(r.name));
      row.appendChild(left);
      row.appendChild(el("span", { class: "v", text: r.value }));
      tip.appendChild(row);
    });
    tip.classList.remove("hidden");
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8);
    var top = y - h - 14;
    if (top < 8) top = y + 18;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hideTip() {
    tip.classList.add("hidden");
    if (tipChart) tipChart.querySelector(".cross").classList.add("hidden");
    tipChart = null;
  }
  document.addEventListener("pointerdown", function (ev) { if (!ev.target.closest("svg")) hideTip(); });

  function redrawCharts() {
    hideTip();
    redrawers.forEach(function (draw) { draw(); });
  }
  function scheduleRedraw() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(redrawCharts, 150);
  }

  // ---------- a figure: title, table toggle, legend, chart, caption
  function figure(title, caption, chartNode, legendItems, table) {
    var fig = el("figure");
    var draw = typeof chartNode === "function" ? chartNode : null;
    if (draw) {
      chartNode = draw(340);
      redrawers.push(function () {
        var css = getComputedStyle(fig);
        var width = fig.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
        var next = draw(width > 0 ? width : 340);
        next.classList.toggle("hidden", chartNode.classList.contains("hidden"));
        chartNode.replaceWith(next);
        chartNode = next;
      });
      if (draw.partialLast) caption = (caption ? caption + " " : "") + (draw.hasBars ? "Последний столбик" : "Последняя точка") + " — сегодня до " + timeUtc(state.data.generated_at) + " UTC.";
    }
    var tb = el("button", { class: "tbtn", type: "button", "aria-pressed": "false", text: "Таблица" });
    fig.appendChild(el("figcaption", null, [el("b", { text: title }), table ? tb : null]));
    if (legendItems && (legendItems.length > 1 || legendItems.some(function (it) { return it.kind === "line"; }))) {
      var lg = el("div", { class: "legend" });
      legendItems.forEach(function (it) {
        var sw = el("i", { class: it.kind === "line" ? "line" : "" });
        sw.style.background = it.color;
        var last;
        if (it.kind === "line") {
          for (var i = it.values.length - 1; i >= 0; i--) {

          }
        }
        var name = it.name + (it.kind === "line" ? " · " + (last === null || last === undefined ? "—" : (draw && draw.fmtValue ? draw.fmtValue(last) : fmt(last))) : "");
        lg.appendChild(el("span", null, [sw, name]));
      });
      fig.appendChild(lg);

    fig.appendChild(chartNode);
    var tbl = table ? table() : null;
    if (tbl) { tbl.classList.add("hidden"); fig.appendChild(tbl); }
    if (caption) fig.appendChild(el("p", { class: "cap", text: caption }));
    tb.addEventListener("click", function () {

      if (tbl) tbl.classList.toggle("hidden", !on);

    return fig;
  }

  function dataTable(head, rows, textColumns) {
    function numeric(c, i) {
      return i > 0 && (!textColumns || textColumns.indexOf(i) < 0) && /^(?:(?:≥ )?\$?−?-?\d[\d\s]*(?:[.,]\d+)?(?: %)?|—)$/.test(String(c));
    }
    var t = el("table");
    if (head[0].indexOf("Когда") === 0) t.classList.add("dated");
    if (head.indexOf("$/ход") >= 0) t.classList.add("money");
    var tr = el("tr");
    head.forEach(function (h, i) { tr.appendChild(el("th", { class: (rows.length && rows.every(function (r) { return numeric(r[i], i); }) ? "num" : "") + (h.length <= 3 ? " short" : ""), text: h })); });

    rows.forEach(function (r) {
      var row = el("tr");

  }

  // ---------- the time chart: stacked or grouped bars and lines on one count axis,
  // a crosshair snapping to the day, one tooltip with every series, keyboard arrows.
  // series: [{name, color, values[], kind: "bar"|"line", stack: bool}]
  function timeChart(days, series, opts, width) {
    opts = opts || {};
    if (width === undefined) {
      var draw = function (w) { return timeChart(days, series, opts, w); };
      draw.partialLast = opts.partialLast;
      draw.hasBars = series.some(function (s) { return s.kind === "bar"; });
      draw.fmtValue = opts.fmtValue;
      return draw;
    }
    var W = width, H = 230, L = opts.fmtTick ? 54 : 36, R = 20, T = 12, B = 30;
    var pw = W - L - R, ph = H - T - B;
    var n = days.length;
    var bars = series.filter(function (s) { return s.kind === "bar"; });
    var lines = series.filter(function (s) { return s.kind !== "bar"; });
    var max = 0;
    for (var i = 0; i < n; i++) {
      var stackTotal = 0, groupMax = 0;
      bars.forEach(function (s) { var v = s.values[i] || 0; if (s.stack) stackTotal += v; else groupMax = Math.max(groupMax, v); });
      max = Math.max(max, stackTotal, groupMax);
      lines.forEach(function (s) { var v = s.values[i]; if (v !== null && v !== undefined) max = Math.max(max, v); });
    }
    // Counts get whole ticks (a chart of ones and twos is not read in quarters); money keeps the fine steps.
    var ticks = niceTicks(max, 4, !opts.fmtTick);
    max = ticks[ticks.length - 1] || 1;
    var slot = pw / n;
    var x = function (i) { return L + slot * i + slot / 2; };
    var y = function (v) { return T + ph - (v / max) * ph; };
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", tabindex: "0", "aria-label": opts.label || "" });
    // gridlines: solid hairlines, recessive
    ticks.forEach(function (tv) {
      svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: y(tv), y2: y(tv), stroke: "var(--grid)", "stroke-width": 1 }));
      svg.appendChild(svgEl("text", { x: L - 6, y: y(tv) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)", text: opts.fmtTick ? opts.fmtTick(tv) : compact(tv) }));
    });
    svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: T + ph, y2: T + ph, stroke: "var(--axis)", "stroke-width": 1 }));
    // x labels: every k-th day so they never collide
    var every = Math.max(1, Math.ceil(38 / slot));
    days.forEach(function (d, i) {
      if ((n - 1 - i) % every !== 0) return;
      svg.appendChild(svgEl("text", { x: x(i), y: H - 10, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)", text: dayLabel(d) }));
    });
    // bars: thin (<= 24px), 2px surface gap between stacked segments and neighbours, rounded data-end
    var groupCount = bars.filter(function (s) { return !s.stack; }).length || 1;
    var gap = Math.min(2, Math.max(0, (slot - 4 * groupCount) / (groupCount + 1)));
    var bw = Math.max(4, Math.min(max <= 1 ? 12 : 24, (slot - gap * (groupCount + 1)) / groupCount));
    for (var i2 = 0; i2 < n; i2++) {
      var acc = 0, g = 0;
      bars.forEach(function (s) {
        var v = s.values[i2] || 0;
        if (v <= 0) { if (!s.stack) g++; return; }
        var bx, by, bh;
        if (s.stack) { bx = x(i2) - bw / 2; by = y(acc + v); bh = y(acc) - by; acc += v; }
        else { bx = x(i2) - (bw * groupCount + gap * (groupCount - 1)) / 2 + (bw + gap) * g; by = y(v); bh = y(0) - by; g++; }
        // Stacked segments keep a 2px surface gap below each one above the first; grouped bars a gap between neighbours.
        var h = Math.max(1, bh - (s.stack && acc - v > 0 ? gap : 0));
        var bar = roundedBar(bx, by, bw, h, s.color, !s.stack);
        if (opts.partialLast && i2 === n - 1) bar.setAttribute("opacity", ".55");
        svg.appendChild(bar);
      });
    }
    // lines: 2px, round joins, markers >= 8px with a 2px surface ring
    lines.forEach(function (s) {
      var d = "", started = false;
      s.values.forEach(function (v, i3) {
        if (v === null || v === undefined) { started = false; return; }
        d += (started ? " L" : " M") + x(i3).toFixed(1) + " " + y(v).toFixed(1);
        started = true;
      });
      svg.appendChild(svgEl("path", { d: d.trim(), fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      s.values.forEach(function (v, i3) {
        if (v === null || v === undefined) return;
        if (n > 14 && i3 !== n - 1) return;
        svg.appendChild(svgEl("circle", { cx: x(i3), cy: y(v), r: 5.5, fill: "var(--card)" }));
        var partial = opts.partialLast && i3 === n - 1;
        svg.appendChild(svgEl("circle", { cx: x(i3), cy: y(v), r: 4, fill: partial ? "var(--card)" : s.color, stroke: partial ? s.color : "none", "stroke-width": partial ? 2 : 0 }));
      });
    });
    // crosshair + hover
    var cross = svgEl("line", { x1: 0, x2: 0, y1: T, y2: T + ph, stroke: "var(--axis)", "stroke-width": 1, class: "cross hidden" });
    svg.appendChild(cross);
    var hit = svgEl("rect", { x: L, y: T, width: pw, height: ph, fill: "transparent" });
    svg.appendChild(hit);
    var current = -1;
    function focusIndex(i, clientX, clientY) {
      if (i < 0 || i >= n) { cross.classList.add("hidden"); hideTip(); current = -1; return; }
      hideTip();
      tipChart = svg;
      current = i;
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.classList.remove("hidden");
      var rows = series.map(function (s) {
        var v = s.values[i];
        return { name: s.name, color: s.color, value: v === null || v === undefined ? "—" : (opts.fmtValue ? opts.fmtValue(v) : fmt(v)) };
      });
      var rect = svg.getBoundingClientRect();
      var px = clientX !== undefined ? clientX : rect.left + (x(i) / W) * rect.width;
      var py = clientY !== undefined ? clientY : rect.top + (T / H) * rect.height;
      showTip(px, py, dayLabel(days[i]) + (opts.partialLast && i === n - 1 ? " (сегодня, не весь день)" : ""), rows);
    }
    function pointerIndex(ev) {
      var rect = svg.getBoundingClientRect();
      var vx = (ev.clientX - rect.left) * (W / rect.width);
      return Math.max(0, Math.min(n - 1, Math.floor((vx - L) / slot)));
    }
    svg.addEventListener("pointermove", function (ev) { if (ev.pointerType !== "touch") focusIndex(pointerIndex(ev), ev.clientX, ev.clientY); });

    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
      body: JSON.stringify({ days: days }),
      signal: controller.signal
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status === 401 ? "Telegram не подтвердил, что это владелец (401). Откройте отчёт из бота ещё раз." : "Сервер ответил " + r.status);
      return r.json();
    }).then(function (data) {
      if (request !== seq) return;
      if (!data || !Array.isArray(data.series) || !data.yesterday || !data.today || !data.period) throw new Error("Сервер ответил не отчётом");
      state.data = data;
      render(data);
    }).catch(function (e) {
      if (request !== seq) return;
      hideTip();
      redrawers = [];
      clear(app);
      app.appendChild(el("p", { class: "err", text: "Не удалось загрузить отчёт: " + (controller.signal.aborted ? "Сервер не ответил за 20 с" : (e && e.message ? e.message : String(e))) }));
      var again = el("button", { class: "tbtn", type: "button", text: "Попробовать ещё раз" });
      again.addEventListener("click", function () { load(state.days); });
      app.appendChild(again);
    }).finally(function () {
      clearTimeout(timeout);
      if (request === seq) app.classList.remove("loading");
    });
  }

  applyScheme();
  window.addEventListener("resize", scheduleRedraw);
  if (tg) {
    tg.ready();
    tg.expand();
    tg.onEvent("themeChanged", applyScheme);
    tg.onEvent("viewportChanged", scheduleRedraw);
  }
  if (!initData) {
    clear(app);
    app.appendChild(el("p", { class: "note", text: "Откройте отчёт из бота" }));
  } else {
    load(state.days);
  }
})();
</script>
</body>
</html>
